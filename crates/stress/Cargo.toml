[package]
name = "stress"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3.34"
rand = { version = "0.10.4", features = ["chacha"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros", "sync"] }
