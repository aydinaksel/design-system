[package]
name = "design-system"
version = "0.4.0"
edition = "2021"
description = "Leptos components styled with Tailwind CSS"
license = "MIT"
repository = "https://github.com/aydinaksel/design-system"
include = ["src", "style"]

[dependencies]
chrono = "0.4"
lepticons = { version = "0.13", default-features = false, features = [
    "account",
    "arrows",
    "cursors",
    "development",
    "files",
    "layout",
    "navigation",
    "notifications",
    "photography",
    "text",
    "time",
] }
leptos = { version = "0.8" }
rust_decimal = { version = "1", default-features = false }
send_wrapper = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
leptos-use-calendar = { version = "0.20", default-features = false, features = ["chrono"] }
leptos-use-cookie = "0.20"
leptos-use-document-visibility = "0.20"
leptos-use-event-listener = "0.20"
leptos-use-fn-debounce-throttle = "0.20"
leptos-use-timeout-fn = "0.20"
leptos-use-window = "0.20"
codee = "0.3"
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
table-query = { path = "../table-query" }

[dependencies.leptos_axum]
version = "0.8"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.web-sys]
version = "0.3"
features = ["Element", "DomTokenList", "HtmlElement", "DomRect", "Window", "MediaQueryList", "Navigator", "Clipboard", "KeyboardEvent", "Selection", "EventTarget", "MouseEvent", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Location", "HtmlAnchorElement", "BeforeUnloadEvent", "NodeList", "DomRectList", "CssStyleDeclaration", "DataTransfer", "DragEvent", "File", "FileList", "HtmlInputElement", "Url", "Blob", "ClipboardEvent", "PointerEvent", "Document", "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "FilePropertyBag", "Crypto"]

[dev-dependencies]
leptos_router = { version = "0.8", features = ["ssr"] }
serde_json = "1"

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos-use-calendar/ssr",
    "leptos-use-cookie/ssr",
    "leptos-use-cookie/axum",
    "leptos-use-document-visibility/ssr",
    "leptos-use-event-listener/ssr",
    "leptos-use-fn-debounce-throttle/ssr",
    "leptos-use-timeout-fn/ssr",
    "leptos-use-window/ssr",
    "dep:leptos_axum",
    "dep:http",
]

[lints]
workspace = true
