[package]
name = "table-query"
version = "0.1.0"
edition = "2021"
description = "Serializable table query state: search, filters, sorting and paging"
license = "MIT"
repository = "https://github.com/aydinaksel/design-system"

[dependencies]
serde = { version = "1", features = ["derive"] }
proptest = { version = "1.12.0", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1.12.0"

[features]
test-strategies = ["dep:proptest"]

[lints]
workspace = true
